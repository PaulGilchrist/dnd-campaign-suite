<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="icon" href="data:," />
<title>3D Indoor Map Viewer</title>
<!--
  Standalone 3D viewer for indoor D&D maps (research / example code).
  Loads the same map JSON the 2D SVG map uses and renders it in three.js.

  Run:
    node demos/3d-map/serve.mjs
    -> http://localhost:8080/demos/3d-map/index.html?path=public/campaigns/Testing%20G3/maps/sealed-sanctum.json

  ?path= is read from the URL; a file picker / drag-and-drop also works (no server needed).
  Requires internet (three.js is loaded from a CDN). Assets are in ./assets/*.glb.
-->
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #111; color: #e6e6e6;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
  #viewport { position: fixed; inset: 0; }
  #topbar { position: fixed; top: 0; left: 0; right: 0; display: flex; align-items: center; gap: 14px;
    padding: 10px 14px; background: rgba(18,18,20,0.82); backdrop-filter: blur(6px);
    border-bottom: 1px solid #2a2a2e; z-index: 10; font-size: 13px; }
  #topbar .title { font-weight: 700; font-size: 14px; color: #ffd76b; }
  #topbar .counts { color: #9aa; }
  #topbar .spacer { flex: 1; }
  #topbar label { display: inline-flex; align-items: center; gap: 5px; cursor: pointer; color: #cfd; }
  #topbar button, #overlay button { background: #2b2b30; color: #e6e6e6; border: 1px solid #3a3a40;
    border-radius: 6px; padding: 5px 10px; cursor: pointer; font-size: 12px; }
  #topbar button:hover, #overlay button:hover { background: #37373d; }
  #overlay { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    background: rgba(8,8,10,0.72); z-index: 20; }
  #overlay.hidden { display: none; }
  .panel { background: #17171a; border: 1px solid #2c2c31; border-radius: 12px; padding: 26px 28px;
    width: 560px; max-width: 92vw; box-shadow: 0 20px 60px rgba(0,0,0,0.5); }
  .panel h1 { margin: 0 0 6px; font-size: 20px; color: #ffd76b; }
  .panel p { margin: 8px 0; color: #a9b; font-size: 13px; }
  .panel .row { display: flex; gap: 8px; margin: 10px 0; }
  .panel input[type="text"] { flex: 1; background: #0f0f11; border: 1px solid #33333a; color: #e6e6e6;
    border-radius: 6px; padding: 8px 10px; font-size: 13px; }
  .panel .hint { color: #778; font-size: 12px; margin: 14px 0 6px; }
  .examples { display: flex; flex-wrap: wrap; gap: 6px; }
  .examples button { font-size: 11px; }
  .err { color: #ff7b72; min-height: 16px; font-size: 12px; }
  #message { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%);
    background: rgba(40,20,20,0.9); border: 1px solid #6b2b2b; color: #ffb4ad; padding: 10px 16px;
    border-radius: 8px; z-index: 30; display: none; max-width: 80vw; }
  #message.show { display: block; }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
  <div id="viewport"></div>
  <div id="topbar">
    <span class="title" id="title">3D Indoor Map</span>
    <span class="counts" id="counts"></span>
    <button id="btnMap">Load map&#8230;</button>
    <span class="spacer"></span>
    <label><input type="checkbox" id="tgRooms" checked /> Rooms</label>
    <label><input type="checkbox" id="tgLabels" checked /> Labels</label>
    <label><input type="checkbox" id="tgTorch" checked /> Torch light</label>
    <button id="btnTop">Top-down</button>
    <button id="btnReload" title="Reload current map">&#8635; Reload</button>
  </div>
  <div id="overlay">
    <div class="panel">
      <h1>3D Indoor Map Viewer</h1>
      <p>Renders the indoor grid map JSON in three.js. Outdoor / hex maps are not supported.</p>
      <div class="row">
        <input id="pathInput" type="text" placeholder="public/campaigns/.../map.json" />
        <button id="goBtn">Load</button>
      </div>
      <div class="row">
        <input type="file" id="fileInput" accept="application/json,.json" />
      </div>
      <p class="hint">Or drag &amp; drop a map JSON anywhere on this window. Examples:</p>
      <div class="examples" id="examples"></div>
      <p class="err" id="errMsg"></p>
    </div>
  </div>
  <div id="message"></div>

<script type="module">
let THREE, OrbitControls, GLTFLoader;
try {
  THREE = await import('three');
  ({ OrbitControls } = await import('three/addons/controls/OrbitControls.js'));
  ({ GLTFLoader } = await import('three/addons/loaders/GLTFLoader.js'));
} catch (e) {
  document.getElementById('errMsg').textContent = 'Failed to load three.js from CDN (internet required).';
  throw e;
}

// ---- constants -------------------------------------------------------------
const CELL = 40;            // 1 grid cell in world units (matches SVG CELL_SIZE)
const WALL_H = 36;
const COLORS = { wall: 0x696969, player: 0x4a90d9, playerStroke: 0x2c5f8a, npc: 0xc0392b, npcStroke: 0xe74c3c };
const ROOM_COLORS = { entrance: 0x4caf50, common: 0x4a90d9, utility: 0xff9800, private: 0xce93d8, grand: 0xffd700, hall: 0x4dd0e1 };
const TWO_CELL = new Set(['table', 'bed', 'bookshelf', 'altar']);
const EXAMPLES = [
  'public/campaigns/Testing G3/maps/sealed-sanctum.json',
  'public/campaigns/Testing G3/maps/crypt-of-fallen-wardens.json',
  'public/campaigns/Testing G1/maps/chult-ruins.json',
  'public/campaigns/Testing G2/maps/upper-mines.json',
];

// ---- state -----------------------------------------------------------------
let scene, camera, renderer, controls, mapGroup, half = 0;
let currentMap = null;
let currentMapPath = null;
let showRooms = true, showLabels = true, showTorch = true;
const assetCache = {};
const gltfLoader = new GLTFLoader();
const textureLoader = new THREE.TextureLoader();
const textureCache = {};
const charCache = {};
let monstersCache = null;

// ---- coordinate helpers ----------------------------------------------------
const cellX = (gx) => gx * CELL + CELL / 2 - half;
const cellZ = (gy) => gy * CELL + CELL / 2 - half;

// ---- scene setup -----------------------------------------------------------
function initScene() {
  const viewport = document.getElementById('viewport');
  renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.05;
  viewport.appendChild(renderer.domElement);

  scene = new THREE.Scene();
  camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 1, 20000);
  controls = new OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.dampingFactor = 0.08;

  scene.add(new THREE.AmbientLight(0xffffff, 0.5));
  scene.add(new THREE.HemisphereLight(0xbfd4ff, 0x1c1c22, 0.55));
  const dir = new THREE.DirectionalLight(0xfff1e0, 1.15);
  dir.position.set(320, 520, 240);
  dir.castShadow = true;
  dir.shadow.mapSize.set(2048, 2048);
  dir.shadow.camera.left = -750; dir.shadow.camera.right = 750;
  dir.shadow.camera.top = 750; dir.shadow.camera.bottom = -750;
  dir.shadow.camera.near = 1; dir.shadow.camera.far = 2200;
  scene.add(dir);

  mapGroup = new THREE.Group();
  scene.add(mapGroup);

  window.addEventListener('resize', onResize);
  animate();
}

function onResize() {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
}

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}

// ---- labels ----------------------------------------------------------------
function makeLabel(text) {
  const canvas = document.createElement('canvas');
  canvas.width = 512; canvas.height = 128;
  const ctx = canvas.getContext('2d');
  ctx.font = 'bold 64px -apple-system, sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.lineWidth = 10; ctx.strokeStyle = 'rgba(0,0,0,0.85)';
  ctx.strokeText(text, 256, 64);
  ctx.fillStyle = '#ffffff';
  ctx.fillText(text, 256, 64);
  const tex = new THREE.CanvasTexture(canvas);
  tex.anisotropy = 4;
  const sprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, transparent: true, depthTest: false }));
  sprite.scale.set(56, 14, 1);
  sprite.renderOrder = 999;
  return sprite;
}

// ---- assets ----------------------------------------------------------------
function loadAsset(type) {
  if (assetCache[type]) return assetCache[type];
  assetCache[type] = new Promise((resolve) => {
    gltfLoader.load(`assets/${type}.glb`,
      (gltf) => {
        gltf.scene.traverse((o) => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; } });
        resolve(gltf.scene);
      },
      undefined,
      () => resolve(null));
  });
  return assetCache[type];
}

function fallbackBox(type) {
  const two = TWO_CELL.has(type);
  const mesh = new THREE.Mesh(
    new THREE.BoxGeometry(two ? 2 * 0.8 : 0.8, 0.7, 0.8),
    new THREE.MeshStandardMaterial({ color: 0x888888, roughness: 0.9 }));
  mesh.castShadow = true; mesh.receiveShadow = true;
  return mesh;
}

// ---- build -----------------------------------------------------------------
function clearMap() {
  if (mapGroup) scene.remove(mapGroup);
  mapGroup = new THREE.Group();
  scene.add(mapGroup);
}

function buildFloorAndGrid(gs, bgFill) {
  const size = gs * CELL;
  const bg = new THREE.Color(bgFill || '#1a1a1a');
  scene.background = bg;
  const floor = new THREE.Mesh(new THREE.PlaneGeometry(size, size), new THREE.MeshStandardMaterial({ color: bg, roughness: 1 }));
  floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true;
  mapGroup.add(floor);
  const grid = new THREE.GridHelper(size, gs, 0x3d3d3d, 0x2b2b2b);
  grid.position.y = 0.4;
  mapGroup.add(grid);
}

function buildWalls(walls) {
  const unique = Array.from(new Set(walls || []));
  if (!unique.length) return;
  const geo = new THREE.BoxGeometry(CELL, WALL_H, CELL);
  const mat = new THREE.MeshStandardMaterial({ color: COLORS.wall, roughness: 0.92 });
  const inst = new THREE.InstancedMesh(geo, mat, unique.length);
  const m = new THREE.Matrix4();
  unique.forEach((key, i) => {
    const [gx, gy] = key.split(',').map(Number);
    m.setPosition(cellX(gx), WALL_H / 2, cellZ(gy));
    inst.setMatrixAt(i, m);
  });
  inst.castShadow = true; inst.receiveShadow = true;
  mapGroup.add(inst);
}

async function buildPlacedItems(items) {
  for (const item of items) {
    if (item.type === 'npc') continue; // NPCs are rendered as tokens
    const proto = await loadAsset(item.type);
    const mesh = proto ? proto.clone() : fallbackBox(item.type);
    mesh.scale.setScalar(CELL);
    const rot = (item.rotation || 0) * Math.PI / 180;
    let x = cellX(item.gridX), z = cellZ(item.gridY);
    if (TWO_CELL.has(item.type)) {
      // Two-cell props extend from the anchor cell toward +X (east) or +Y (south),
      // matching the 2D map — regardless of the 180/270 "flip" of the rotation.
      const isVertical = ((item.rotation || 0) % 180) === 90;
      if (isVertical) z += 0.5 * CELL;
      else x += 0.5 * CELL;
    }
    mesh.position.set(x, 0, z);
    mesh.rotation.y = -rot + (item.open ? Math.PI / 2 : 0);
    if (item.visible === false) setDimmed(mesh);
    mapGroup.add(mesh);
  }
}

// Render a hidden item (secret door / trap) dimmed, like the 2D GM view.
function setDimmed(obj) {
  obj.traverse((o) => {
    if (o.isMesh && o.material) {
      o.material = o.material.clone();
      o.material.transparent = true;
      o.material.opacity = 0.5;
      o.material.depthWrite = false;
    }
  });
}

function makeToken(name, color, stroke) {
  const g = new THREE.Group();
  const body = new THREE.Mesh(new THREE.CylinderGeometry(15, 17, 10, 24), new THREE.MeshStandardMaterial({ color, roughness: 0.5 }));
  body.position.y = 5; body.castShadow = true;
  g.add(body);
  const ring = new THREE.Mesh(new THREE.RingGeometry(15, 19, 28), new THREE.MeshBasicMaterial({ color: stroke, side: THREE.DoubleSide }));
  ring.rotation.x = -Math.PI / 2; ring.position.y = 0.5;
  g.add(ring);
  if (showLabels) {
    const label = makeLabel(name);
    label.position.y = 26;
    g.add(label);
  }
  return g;
}

function buildPlayers(players) {
  for (const p of players || []) {
    const token = makeToken(p.name, COLORS.player, COLORS.playerStroke);
    token.position.set(cellX(p.gridX), 0, cellZ(p.gridY));
    mapGroup.add(token);
    playerAvatarUrl(p).then((url) => addAvatar(token, url));
  }
}

function buildRooms(rooms) {
  if (!showRooms) return;
  for (const room of rooms || []) {
    const r = room.rect;
    const color = ROOM_COLORS[room.type] || ROOM_COLORS.common;
    const w = r.w * CELL, h = r.h * CELL;
    const x = r.x * CELL + w / 2 - half, z = r.y * CELL + h / 2 - half;
    const patch = new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 0.13, depthWrite: false }));
    patch.rotation.x = -Math.PI / 2; patch.position.set(x, 0.6, z);
    mapGroup.add(patch);
    if (showLabels) {
      const label = makeLabel(room.label || room.type);
      label.position.set(x, 8, z);
      mapGroup.add(label);
    }
  }
}

function buildPointLights(items) {
  if (!showTorch) return;
  let count = 0;
  for (const item of items || []) {
    if ((item.type === 'torch' || item.type === 'firepit') && item.visible !== false && count < 12) {
      const l = new THREE.PointLight(0xff8833, 1.3, 130, 2);
      l.position.set(cellX(item.gridX), 14, cellZ(item.gridY));
      mapGroup.add(l);
      count++;
    }
  }
}

function frameCamera(gs) {
  const size = gs * CELL;
  camera.near = 1; camera.far = size * 12;
  camera.updateProjectionMatrix();
  camera.position.set(size * 0.52, size * 0.5, size * 0.92);
  controls.target.set(0, 0, 0);
  controls.update();
}

async function buildMap(mapData) {
  clearMap();
  const gs = mapData.gridSize || 30;
  half = (gs * CELL) / 2;
  buildFloorAndGrid(gs, mapData.bgFill);
  buildWalls(mapData.walls);
  buildRooms(mapData.rooms);
  const items = mapData.placedItems || [];
  await buildPlacedItems(items);
  buildPlayers(mapData.players);
  buildNpcs(items);
  buildPointLights(items);
  frameCamera(gs);
  updateCounts(mapData);
}

function buildNpcs(items) {
  for (const item of items) {
    if (item.type !== 'npc') continue;
    const token = makeToken(item.name || 'NPC', COLORS.npc, COLORS.npcStroke);
    token.position.set(cellX(item.gridX), 0, cellZ(item.gridY));
    if (item.visible === false) { dimToken(token); token.userData.dimmed = true; }
    mapGroup.add(token);
    npcAvatarUrl(item.name).then((url) => addAvatar(token, url));
  }
}

// Dim a hidden (invisible) creature token, like the 2D GM view.
function dimToken(token) {
  token.traverse((o) => {
    if (o.isMesh && o.material) { o.material.transparent = true; o.material.opacity = 0.5; }
  });
}

function updateCounts(mapData) {
  const walls = new Set(mapData.walls || []).size;
  const items = (mapData.placedItems || []).filter(i => i.type !== 'npc').length;
  const npcs = (mapData.placedItems || []).filter(i => i.type === 'npc').length;
  const players = (mapData.players || []).length;
  const rooms = (mapData.rooms || []).length;
  document.getElementById('title').textContent = mapData.displayName || '3D Indoor Map';
  document.getElementById('counts').textContent =
    `${walls} walls · ${items} items · ${players} players · ${npcs} npcs · ${rooms} rooms`;
}

// ---- loading flow ----------------------------------------------------------
function hideOverlay() { document.getElementById('overlay').classList.add('hidden'); }
function showMessage(text) {
  const el = document.getElementById('message');
  el.textContent = text; el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 5000);
}

function showMap(mapData) {
  currentMap = mapData;
  if (mapData.type === 'outdoor') {
    const text = 'This is an outdoor/hex map. The 3D test only supports indoor grid maps.';
    document.getElementById('errMsg').textContent = text;
    showMessage(text);
    return; // keep the overlay visible so another map can be chosen
  }
  hideOverlay();
  buildMap(mapData);
}

function resolveFetchUrl(p) {
  if (/^https?:\/\//.test(p) || p.startsWith('//') || p.startsWith('/')) return p;
  return '/' + p; // treat bare paths as relative to the server root
}

async function loadJson(url) {
  const res = await fetch(encodeURI(resolveFetchUrl(url)));
  if (!res.ok) throw new Error(`HTTP ${res.status}`);
  return res.json();
}

function loadTexture(url) {
  const key = resolveFetchUrl(url);
  if (textureCache[key]) return textureCache[key];
  textureCache[key] = new Promise((resolve) => {
    textureLoader.load(encodeURI(key),
      (tex) => { tex.colorSpace = THREE.SRGBColorSpace; tex.anisotropy = 8; resolve(tex); },
      undefined,
      () => resolve(null));
  });
  return textureCache[key];
}

// Circular portrait disc that sits on top of a token cylinder.
function makeAvatar(texture) {
  const disc = new THREE.Mesh(
    new THREE.CircleGeometry(13, 32),
    new THREE.MeshBasicMaterial({ map: texture, transparent: true, side: THREE.DoubleSide }));
  disc.rotation.x = -Math.PI / 2;
  disc.position.y = 10.5;
  return disc;
}

function addAvatar(token, url) {
  if (!url) return;
  loadTexture(url).then((tex) => {
    if (!tex) return;
    const disc = makeAvatar(tex);
    if (token.userData.dimmed) disc.material.opacity = 0.5;
    token.add(disc);
  });
}

// The demo server serves the REPO ROOT, so campaign data lives under
// <publicRoot>/campaigns/<campaign>/. Derive <publicRoot>/campaigns/<campaign>
// (e.g. "public/campaigns/Testing G3") from the map path.
function deriveCampaignDir(p) {
  const m = /((?:[^/]+\/)*campaigns\/[^/]+)\//.exec(p || '');
  return m ? m[1] : null;
}

// <publicRoot> is whatever precedes "/campaigns/" in the map path ("" when none).
function derivePublicRoot(p) {
  const i = (p || '').indexOf('/campaigns/');
  return i >= 0 ? p.slice(0, i) : '';
}

// Player avatar: <campaignDir>/<id>.json -> imagePath.
async function playerAvatarUrl(p) {
  const dir = deriveCampaignDir(currentMapPath);
  if (!dir) return null;
  if (charCache[p.id] === undefined) {
    try { charCache[p.id] = (await loadJson(`${dir}/${p.id}.json`)).imagePath || null; }
    catch { charCache[p.id] = null; }
  }
  const img = charCache[p.id];
  if (!img) return null;
  return img.includes('campaigns/') ? img : `${dir}/${img}`;
}

// Creature avatar: <publicRoot>/data/monsters.json lookup -> remote portrait (mirrors monsterUtils).
async function npcAvatarUrl(name) {
  if (!name) return null;
  if (!monstersCache) {
    const root = derivePublicRoot(currentMapPath) || 'public';
    try { monstersCache = await loadJson(`${root}/data/monsters.json`); }
    catch { monstersCache = []; }
  }
  const base = name.replace(/\s+\d+$/, '');
  const monster = monstersCache.find((m) => m.name.toLowerCase() === base.toLowerCase());
  return monster ? `https://paulgilchrist.github.io/dnd-tools/images/${monster.index}.jpg` : null;
}

async function loadFromPath(p) {
  const errEl = document.getElementById('errMsg');
  errEl.textContent = '';
  currentMapPath = p;
  try {
    const res = await fetch(encodeURI(resolveFetchUrl(p)));
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    showMap(await res.json());
  } catch (e) {
    errEl.textContent = `Could not load "${p}": ${e.message}`;
  }
}

function loadFromFile(file) {
  const errEl = document.getElementById('errMsg');
  errEl.textContent = '';
  currentMapPath = null; // local file: no server campaign to resolve player portraits from
  const reader = new FileReader();
  reader.onload = () => {
    try { showMap(JSON.parse(reader.result)); }
    catch (e) { errEl.textContent = 'Invalid JSON: ' + e.message; }
  };
  reader.readAsText(file);
}

// ---- UI wiring -------------------------------------------------------------
function wireUI() {
  document.getElementById('goBtn').addEventListener('click', () => {
    const p = document.getElementById('pathInput').value.trim();
    if (p) loadFromPath(p);
  });
  document.getElementById('pathInput').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') { const p = e.target.value.trim(); if (p) loadFromPath(p); }
  });
  document.getElementById('fileInput').addEventListener('change', (e) => {
    if (e.target.files[0]) loadFromFile(e.target.files[0]);
  });
  const ex = document.getElementById('examples');
  EXAMPLES.forEach((p) => {
    const b = document.createElement('button');
    b.textContent = p.split('/').slice(-1)[0].replace('.json', '');
    b.addEventListener('click', () => loadFromPath(p));
    ex.appendChild(b);
  });
  const re = (fn) => { if (currentMap && currentMap.type !== 'outdoor') buildMap(currentMap); fn(); };
  document.getElementById('tgRooms').addEventListener('change', (e) => { showRooms = e.target.checked; re(() => {}); });
  document.getElementById('tgLabels').addEventListener('change', (e) => { showLabels = e.target.checked; re(() => {}); });
  document.getElementById('tgTorch').addEventListener('change', (e) => { showTorch = e.target.checked; re(() => {}); });
  document.getElementById('btnTop').addEventListener('click', () => {
    const gs = (currentMap?.gridSize || 30) * CELL;
    camera.position.set(0, gs * 1.15, 0.01);
    controls.target.set(0, 0, 0);
    controls.update();
  });
  document.getElementById('btnReload').addEventListener('click', () => {
    if (currentMap) buildMap(currentMap);
  });
  document.getElementById('btnMap').addEventListener('click', () => {
    document.getElementById('overlay').classList.remove('hidden');
    document.getElementById('errMsg').textContent = '';
  });
  window.addEventListener('dragover', (e) => e.preventDefault());
  window.addEventListener('drop', (e) => {
    e.preventDefault();
    if (e.dataTransfer.files[0]) loadFromFile(e.dataTransfer.files[0]);
  });
}

// ---- boot ------------------------------------------------------------------
initScene();
wireUI();
const urlPath = new URLSearchParams(location.search).get('path');
if (urlPath) {
  document.getElementById('pathInput').value = urlPath;
  loadFromPath(urlPath);
}
</script>
</body>
</html>
